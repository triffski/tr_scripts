<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stash-O-Matic 5000</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314171c'/%3E%3Cpath d='M11 39 53 59M53 39 11 59' stroke='%23e8c547' stroke-width='6.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='25' r='16' fill='%23f2f2f2'/%3E%3Crect x='23' y='33' width='18' height='11' rx='3' fill='%23f2f2f2'/%3E%3Ccircle cx='25.5' cy='25' r='4.8' fill='%2314171c'/%3E%3Ccircle cx='38.5' cy='25' r='4.8' fill='%2314171c'/%3E%3Cpath d='M32 30l-2.6 4.5h5.2z' fill='%2314171c'/%3E%3Cpath d='M28 38.5v4M32 38.5v4M36 38.5v4' stroke='%2314171c' stroke-width='1.8'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1114">
<style>
:root{
  --bg:#0f1114;--panel:#171a1f;--panel2:#1e2228;--line:#2a2f37;--text:#e7e9ec;--muted:#8b929c;
  --keep:#e5484d;--hold:#c4620f;--print:#e8c547;--sell:#3fb950;--repair:#8a97ad;--key:#3fb3a8;
  --r-u:#5fa83c;--r-r:#3a78c9;--r-e:#8a5fdc;--r-l:#de8a2c;--r-x:#d23f3a;--r-n:#7d8590;--r-c:#8b929c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,20,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -12px;padding:10px 12px 8px}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.1px;white-space:nowrap}
.title h1 span{color:var(--print)}
.tabs{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.tabs button{padding:7px 9px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text)}
.search{margin-top:8px;position:relative}
.search input{width:100%;padding:11px 38px 11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px;outline:none}
.search input:focus{border-color:#4b5563}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px;display:none}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{color:var(--text);border-color:#4b5563;background:var(--panel2)}
.chip b{font-weight:700;color:var(--text)}
.legend{margin:10px 2px 4px;font-size:12px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.legend span{display:grid!important;grid-template-columns:10px 1fr;column-gap:6px;align-items:baseline}
.legend b{color:var(--text);font-size:13px}
.legend em{font-style:normal;grid-column:2}
.legend span{display:flex;gap:6px;align-items:baseline}
.legend i{flex:none;width:8px;height:8px;border-radius:2px;transform:translateY(1px)}
.list{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 0;background:var(--panel);border-radius:10px;border-left:4px solid var(--c);min-height:56px;width:100%;text-align:left}
.item:active{background:var(--panel2)}
.ico,.mi{flex:none;display:grid;place-items:center;color:#eceef0;box-shadow:inset 0 3px 0 var(--rc);border-radius:5px;padding:0;background:radial-gradient(rgba(255,255,255,.07) .8px,transparent .9px) 0 0/4px 4px,linear-gradient(180deg,color-mix(in srgb,var(--rc) 55%,#14171c),color-mix(in srgb,var(--rc) 14%,#14171c))}
.ico{width:40px;height:40px;margin-left:8px}
.ico svg{width:24px;height:24px}
.meta{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm mark{background:color-mix(in srgb,var(--print) 35%,transparent);color:inherit;border-radius:3px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;text-align:right}
.badge .v{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 7px;border-radius:6px;background:var(--c);color:#111}
.badge .q{font-size:12.5px;color:var(--text);margin-top:3px;font-weight:600}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.sec-h{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text);margin:16px 2px 4px;display:grid;grid-template-columns:10px 1fr;column-gap:7px;align-items:center}
.sec-h i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.sec-h small{grid-column:2;font-size:12.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:1px}
/* FOB tree */
.summary{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.summary{display:flex;gap:8px;margin:10px 0 2px}
.summary small{display:block;color:var(--muted);font-size:12px}
.summary b{font-size:17px}
.station{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px}
.up{background:var(--panel);border-radius:12px;padding:10px 10px 4px;margin-bottom:8px}
.up-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.up-h b{font-size:15px}
.up-h span{font-size:12.5px;color:var(--muted)}
.tier{position:relative;display:flex;gap:10px;padding:0 0 10px 0}
.tier:before{content:"";position:absolute;left:17px;top:34px;bottom:0;width:2px;background:var(--line)}
.tier:last-child:before{display:none}
.node{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid #4b5563;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--bg);position:relative;z-index:1}
.tier.next .node{border-color:var(--keep);box-shadow:0 0 0 3px color-mix(in srgb,var(--keep) 25%,transparent)}
.tier.done .node{background:#2a2f37;border-color:#2a2f37;color:var(--muted)}
.tier.done .node:after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--sell);color:#111;font-size:10px;display:grid;place-items:center}
.tbody{flex:1;min-width:0;padding-top:2px}
.tline{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.tline .eff{font-weight:600}
.tline .cash{color:var(--muted);white-space:nowrap}
.tier.done .tline,.tier.done .need{text-decoration:line-through;opacity:.45}
.need{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ichip{display:flex;align-items:center;gap:5px;padding:4px 8px 4px 4px;border-radius:8px;background:var(--panel2);font-size:12.5px;border:1px solid var(--line)}
.ichip .mi{width:24px;height:24px;box-shadow:inset 0 2px 0 var(--rc);border-radius:4px}
.ichip .mi svg{width:16px;height:16px;min-width:16px;display:block}
.ico svg{display:block}
.ichip b{font-weight:700}
.flag{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid #4b5563;color:var(--muted);margin-left:4px;text-decoration:none;display:inline-block}
.tnote{font-size:12px;color:var(--muted);margin-top:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:16px 16px 0 0;max-height:82vh;overflow:auto;transform:translateY(100%);transition:transform .2s ease;padding:8px 16px calc(76px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#4b5563;margin:2px auto 10px}
.sh-h{display:flex;gap:12px;align-items:center}
.sh-h .ico{margin:0;width:48px;height:48px}
.sh-h .ico svg{width:28px;height:28px}
.sh-h h2{margin:0;font-size:18px}
.sh-h .sub{white-space:normal}
.verdict{margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.verdict .vt{font-weight:800;color:var(--c);font-size:13px;letter-spacing:.4px}
.verdict .keep{font-size:20px;font-weight:800;margin:2px 0}
.verdict ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:#cfd3d8}
.verdict li{margin:1px 0}
.sh-sec{margin-top:14px}
.sh-sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row.done{opacity:.45;text-decoration:line-through}
.row .r{white-space:nowrap;font-weight:700}
.row .tag{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;background:var(--keep);color:#111;margin-left:6px;text-decoration:none}
.rec{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec b{font-weight:600}
.rec small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.rec em{font-style:normal;color:var(--print);font-weight:700}
.more{margin-top:6px;font-size:13px;color:var(--r-r);font-weight:600}
.foot{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
.foot a{color:var(--r-r)}
.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600}
/* desktop hover tooltip */
.tip{position:fixed;z-index:50;width:340px;max-height:70vh;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;display:none;font-size:13px}
.tip .sh-sec{margin-top:10px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid #3a414b;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.6);max-height:60vh;overflow:auto;z-index:30;padding:4px}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border-radius:8px}
.res:active,.res.sel{background:#2a2f37}
.res .ico{margin:0;width:32px;height:32px}
.res .ico svg{width:18px;height:18px}
.res .meta .nm{font-size:14.5px}
.kind{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:5px;background:#3a414b;color:var(--text)}
.res-n{font-size:12px;color:var(--muted);padding:6px 8px 4px}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--print)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flash 1.8s ease-out}
.up.craft{padding:10px}
.craft-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.craft-h .ico{margin:0}
.craft-h .nm{white-space:normal;text-align:left}
.craft-h .sub{white-space:normal;overflow:visible;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
.ico.gear{--rc:#8b929c;background:linear-gradient(180deg,#4a5059,#262a31)}
.ext{color:var(--r-r);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);margin-left:8px;vertical-align:middle;flex:none}
.ext svg{width:15px;height:15px;display:block}
.ext:active{background:var(--panel2)}
.codex{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--r-r);font-size:13.5px;font-weight:600;text-decoration:none}
.codex svg{width:15px;height:15px}
.io{margin:18px 2px 0;font-size:13px;color:var(--muted)}
.io summary{cursor:pointer;list-style:none;padding:6px 0;opacity:.7}
.io summary::-webkit-details-marker{display:none}
.io[open] summary{opacity:1}
.codebox{flex:1;min-width:0;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 15px ui-monospace,Menlo,monospace;letter-spacing:1px;outline:none}
.mi.rsc{background:linear-gradient(180deg,#4a5059,#262a31);box-shadow:inset 0 2px 0 #8b929c}
.where{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.grid{display:inline-block;min-width:26px;text-align:center;font:700 11.5px ui-monospace,Menlo,monospace;padding:1px 4px;margin-right:7px;border-radius:4px;background:#2a2f37;color:#aab1ba;vertical-align:1px}
.slots{font-size:.68em;font-weight:500;color:var(--muted)}
.grid.x01{color:#ff5a5f}
.grid.tL{color:#5b9cf0}.grid.tM{color:#4cc35e}.grid.tH{color:#e8c547}.grid.tC{color:#f08a34}.grid.tX{color:#ff5a5f}
.tlegend{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.tlegend .grid{font-size:10px;margin:0;opacity:.9}
.spots{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px}.spot{white-space:nowrap}
.rfind{font-size:12px;color:var(--muted);margin-top:2px}
.cont{font-size:12.5px;color:var(--muted);margin:-2px 0 6px}
.needs{color:var(--hold);font-weight:700}
.row.link{width:100%;text-align:left;cursor:pointer}
.row.link span:first-child{text-decoration:underline;text-decoration-color:#4b5563;text-underline-offset:3px}
.row.link.done span:first-child{text-decoration:line-through}
.reclink{font-weight:600;text-decoration:underline;text-decoration-color:#4b5563;text-underline-offset:3px}
.backbtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:4px;height:40px;padding:0 15px 0 10px;border-radius:20px;background:rgba(30,34,40,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #3a414b;color:var(--text);font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.backbtn svg{width:18px;height:18px;color:var(--print)}
.backbtn:active{background:#2a2f37}
.summary{align-items:stretch}
.sbox{flex:1;min-width:0;text-align:left;background:var(--panel);border-radius:10px;padding:9px 11px;border:1px solid transparent}
.sbox small{display:block;color:var(--muted);font-size:12px}
.sbox b{display:block;font-size:16px;margin-bottom:6px}
.sbox b:last-of-type{margin-bottom:0}
.sugg{flex:2;border-color:color-mix(in srgb,var(--print) 30%,transparent)}
.sugg b{font-size:14.5px;color:var(--print);line-height:1.25;margin:1px 0 3px}
.sugg span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.sugg{position:relative}
.info{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:1px solid #4b5563;color:var(--muted);font:italic 700 12px/18px Georgia,serif;text-align:center}
.stip{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;background:var(--panel2);border:1px solid #3a414b;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.4;color:var(--text);box-shadow:0 10px 24px rgba(0,0,0,.55);text-align:left}
.craft-h .meta{flex:1;min-width:0}
.learn{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #4b5563;color:transparent;display:grid;place-items:center;align-self:flex-start}
.learn svg{width:18px;height:18px}
.learn.on{background:var(--sell);border-color:var(--sell);color:#111}
.learn:disabled{opacity:.55}
.up.craft.learnt{box-shadow:inset 3px 0 0 var(--sell)}
.lrn{color:var(--sell);font-weight:800;margin-left:5px}
#craftCats{margin:10px 0 0}#craftChips{margin:6px 0 2px}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px;margin:10px 0 0}
.seg button{flex:1;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Stash-O-Matic <span>5000</span></h1>
      <div class="tabs"><button id="tFob">FOB</button><button id="tCraft">Crafting</button><button id="tStash" class="on">Loot</button></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search loot, recipes, upgrades…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"><button class="clr" id="clr" aria-label="Clear">×</button>
      <div class="results hide" id="results"></div></div>
    <div class="chips" id="chips"></div>
  </header>

  <section id="stashView">
    <div class="list" id="list"></div>
  </section>

  <section id="craftView" class="hide">
        <div class="seg" id="craftSeg"><button data-cv="recipes" class="on">3D Printer</button><button data-cv="manuals">Gunsmith</button></div>
        <div class="chips" id="craftCats"></div>
        <div class="chips" id="craftChips"></div>
        <div class="list" id="craftList"></div>
  </section>

  <section id="fobView" class="hide">
    <div class="summary" id="summary"></div>
    <div id="tree"></div>
    <details class="io">
      <summary>Export / import · reset</summary>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="code" class="codebox" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Paste a code"><button class="btn" id="copyBtn">Copy</button><button class="btn" id="loadBtn">Load</button></div>
      <div class="tnote" id="codeMsg"></div>
      <div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="resetBtn">Reset all</button><button class="btn hide" id="resetYes" style="border-color:var(--keep);color:var(--keep)">Confirm reset</button></div>
    </details>
  </section>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="tip" id="tip"></div>
<button class="backbtn hide" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Back</span></button>

<script>
"use strict";
/* ---------- icons ---------- */
const ICONS={
  bottle:'<path d="M10 2.5h4v3l1.5 2.5v12a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 8.5 20V8L10 5.5z"/><path d="M8.5 12h7v6h-7z" fill="currentColor" fill-opacity=".35"/>',
  radio:'<rect x="7" y="7" width="10" height="14" rx="1.5"/><path d="M14 7V2.5"/><rect x="9" y="9.5" width="6" height="4" rx=".5" fill="currentColor" fill-opacity=".35"/><path d="M9.5 16.5h5M9.5 18.5h5"/>',
  coil:'<ellipse cx="11" cy="11" rx="7.5" ry="5.5"/><ellipse cx="11" cy="11" rx="4.5" ry="3"/><path d="M16 15.5l2 5M18 14.5l3.5 4"/>',
  device:'<path d="M3 15l2-6h14l2 6v4H3z"/><path d="M3 15h18M7 12h6"/><circle cx="17" cy="12" r="1" fill="currentColor"/>',
  shavings:'<path d="M4 18c3-1 4-4 3-7s1-6 4-6"/><path d="M9 20c3-1 5-4 4-7s1-6 4-7"/><path d="M14 21c3-1 5-3 5-6"/>',
  notes:'<path d="M6 3h12v18H6z"/><path d="M6 7h12M9 3v2M12 3v2M15 3v2M9 11h6M9 14h6M9 17h4"/>',

/* ---------- classification ---------- */
const VERDICT={
  keep:{label:"FOB",c:"--keep",ord:0,name:"FOB",sub:"Items used for FOB upgrades."},
  hold:{label:"SCARCE",c:"--hold",ord:1,name:"Scarce",sub:"Rare item, no current use. Sell or keep a stack just in case."},
  print:{label:"CRAFT",c:"--print",ord:2,name:"Crafting",sub:"Ingredients used for crafting items."},
  key:{label:"KEY",c:"--key",ord:3.5,name:"Keys",sub:"Opens loot rooms and lockers."},
  repair:{label:"REPAIR",c:"--repair",ord:3,name:"Repair",sub:"Vehicle repair parts. Keep a few for repairs."},
  sell:{label:"SELL",c:"--sell",ord:4,name:"Sell",sub:"Common item, no current use."}
};
function printUnlock(it){
  if(!it.made) return null;
  if(it.made.unlock==="Uncommon Ingredient Printing") return {up:"uncPrint",label:"Uncommon Ingredient Printing"};
  if(it.made.unlock==="Epic Ingredient Printing") return {up:"epicPrint",label:"Epic Ingredient Printing"};
  return {up:null,label:it.made.unlock+" recipe (unlock not documented)"};
}
function canPrintNow(it){
  const p=printUnlock(it); if(!p||!p.up) return false;
  const u=UPGRADES.find(x=>x.id===p.up); return nDone(u)>=1;
}
function assess(it){
  if(it.type==="Key"){const k=KEYINFO[it.name]||{};return {v:"key",remaining:0,next:0,keepTxt:k.needs?"Needs something first":"Works on its own",slotTxt:"",reason:k.needs?[k.needs]:[]};}
  if(it.type==="Repair") return {v:"repair",remaining:0,next:0,keepTxt:"Keep a few",slotTxt:"",reason:["Vehicle repair part"]};
  let remaining=0,next=0,unverified=0;
  for(const x of it.ups){
    if(isDone(x.u,x.t)) continue;
    remaining+=x.qty;
    if(isNext(x.u,x.t)) next+=x.qty;
    if(x.t.flag==="unverified") unverified+=x.qty;
  }
  const stack=it.stack||10, approx=!it.stack;
  const rank=it.rar?RAR[it.rar][2]:3; // unknown rarity treated as scarce
  const printable=canPrintNow(it);
  let v,reason,keepTxt,slotTxt="";
  const slots=n=>{if(approx)return "";const s=Math.ceil(n/stack);return `${s} slot${s>1?"s":""}`;};
  if(remaining>0){
    v="keep";
    keepTxt=`Keep ${remaining}`;slotTxt=slots(remaining);
    const bits=[];
    if(printable) bits.push(`Printable now`);
    else if(it.made && it.rar==="U") bits.push(`Printable after Uncommon Printing`);
    else if(it.made && it.rar==="E") bits.push(`Printable after Epic Printing`);
    reason=bits;
  }else if(!it.recs.length){
    if(it.ups.length && rank>=3){
      v="hold";keepTxt="Keep a few";
      reason=["FOB tiers done","Higher tiers may reuse it"];
    }else if(it.type==="Valuable" && (rank>=3 || RARE_FIND.has(it.name))){
      v="hold";keepTxt="Sell or keep a stack";
      reason=["No FOB or recipe use","Rare find, keep a stack just in case"];
    }else{
      v="sell";keepTxt="Keep 0";
      reason=NOTE[it.name]?[NOTE[it.name],"No FOB or recipe use"]:it.ups.length?["FOB tiers done","No recipes"]:["No FOB or recipe use"];
    }
  }else if(printable){
    v="print";keepTxt="Only for planned prints";
    reason=[(it.ups.length?"No FOB use left":"Not used for FOB"),"Print on demand"];
  }else if(rank>=2){
    v="hold";keepTxt="Keep 1 stack";
    reason=[(it.ups.length?"No FOB use left":"Not used for FOB"),`Can't print${it.made?" yet":""}`,`In ${it.recs.length} recipe${it.recs.length>1?"s":""}`];
  }else{
    v="print";keepTxt="Only for planned prints";
    reason=[(it.ups.length?"No FOB use left":"Not used for FOB"),"Common, recipes only"];
  }
  return {v,remaining,next,keepTxt,slotTxt,reason};
}

/* ---------- search ---------- */
function match(it,q){
  if(!q) return {score:1};
  const qc=q.replace(/ /g,"");
  let i=it.n.indexOf(q);
  if(i===0) return {score:100,hl:[i,q.length]};
  if(i>0) return {score:80,hl:[i,q.length]};
  if(it.initials.startsWith(qc)) return {score:70};
  if(it.compact.includes(qc)) return {score:60};
  const qt=q.split(" ");
  if(qt.every(t=>it.words.some(w=>w.startsWith(t)))) return {score:50};
  if(it.alt && it.alt.includes(q)) return {score:45};
  return null;
}
function hlName(it,m){
  if(!m||!m.hl) return esc(it.name);
  // same length as the raw name, so offsets line up
  const raw=it.name,n2=raw.toLowerCase().replace(/[^a-z0-9 ]/g," ");
  const q=it.n.substr(m.hl[0],m.hl[1]),j=n2.indexOf(q);
  if(j<0) return esc(raw);
  return esc(raw.slice(0,j))+"<mark>"+esc(raw.slice(j,j+q.length))+"</mark>"+esc(raw.slice(j+q.length));
}

/* ---------- suggested next upgrade ---------- */
const RW={U:1,R:2,E:3,L:10,X:8};
function printUnits(kind,except){ // remaining required units of ingredients this printing upgrade unlocks
  let n=0,types=new Set();
  for(const it of Object.values(ITEMS)){
    const p=printUnlock(it); if(!p||p.up!==kind) continue;
    for(const x of it.ups){ if(isDone(x.u,x.t)||x.u.id===except) continue; n+=x.qty; types.add(it.name); }
  }
  return {n,types:types.size,names:[...types].sort()};
}
function upDesc(u,t){
  if(u.id==="uncPrint"||u.id==="epicPrint"){const pu=printUnits(u.id,u.id);return `Allows printing of ${pu.names.join(", ")} - ${pu.n} total required for remaining upgrades.`;}
  if(u.id==="bank") return `Raises bank cap to ${t.eff.replace("Cap ","")}.`;
  if(u.id==="mia") return "5% off Operator recovery.";
  if(u.id==="gunsmith") return "5% off Gunsmith purchases.";
  if(u.id==="vendor") return "More items at the Vendor.";
  return t.eff+".";
}
function suggestNext(){
  let best=null;
  for(const u of UPGRADES){
    const t=u.tiers[nDone(u)]; if(!t||t.flag==="unverified") continue;
    if(u.id==="epicPrint"&&!nDone(UPGRADES.find(x=>x.id==="uncPrint"))) continue;
    const cash=t.cash==null?150000:cashVal(t.cash);
    let w=0; for(const n in t.need){const it=ITEMS[n];w+=t.need[n]*(it&&it.rar?RW[it.rar]:4);}
    const cost=cash/25000+w/10+.5;
    let ben,why;
    if(u.id==="uncPrint"||u.id==="epicPrint"){const pu=printUnits(u.id,u.id);ben=pu.n/5+10;why=`Prints ${pu.types} ingredients you need ${pu.n} of`;}
    else if(u.id==="stashItem"){ben=30;why="More stash space";}
    else if(u.id==="stashWeapon"){ben=15;why="More weapon slots";}
    else if(u.id==="bank"){ben=6;why="Higher cash cap";}
    else if(u.id==="mia"||u.id==="gunsmith"){ben=8;why=t.eff;}
    else {ben=5;why=t.eff;}
    const sc=ben/cost;
    if(!best||sc>best.sc) best={u,t,why,sc};
  }
  return best;
}

const RECIPE_ICON=[["Backpack","backpack"],["Concussion","grenade"],["Vest","vest"],["Armor","vest"],["Box","crate"],["Care Package","crate"],["Drone","drone"],["UAV","radar"],["Radar","radar"],["Spotter","radar"],["Gas Mask","gasmask"],["Rebreather","gasmask"],["Night Vision","nvg"],["NVG","nvg"],["Parachute","parachute"],["Keycard","keycard"],["C4","charge"],["Charge","charge"],["Thermite","charge"],["Semtex","grenade"],["Mine","mine"],["Claymore","mine"],["Medkit","med"],["Bandage","med"],["Stim","syringe"],["Sedative","syringe"],["Self-Revive","syringe"],["Pain Killers","pill"],["Radiation","pill"],["Smelling","pill"],["Energy Drink","can"],["Defibrillator","pulse"],["Heartbeat","pulse"],["Sentry","turret"],["Turret","turret"],["Crossfire","turret"],["Knife","knife"],["Shock Stick","knife"],["Riot Shield","shield"],["Trophy","shield"],["Bombing","plane"],["Artillery","plane"],["Glider","plane"],["Warhead","plane"],["Fulton","plane"],["Decoy","decoy"],["Screamer","decoy"],["Pistol","pistol"],["Zip Gun","pistol"],["Wire","wire"],["DDOS","radio"],["Molotov","flame"]];
const recipeIcon=r=>{const m=RECIPE_ICON.find(([k])=>r.name.includes(k));return m?(ICONS["g_"+m[1]]?"g_"+m[1]:m[1]):"g_grenade";};
function nameMatch(name,q){
  const n=norm(name),w=n.split(" "),qc=q.replace(/ /g,"");
  const i=n.indexOf(q);
  if(i===0) return 100; if(i>0) return 80;
  if(w.map(x=>x[0]).join("").startsWith(qc)) return 70;
  if(n.replace(/ /g,"").includes(qc)) return 60;
  if(q.split(" ").every(t=>w.some(x=>x.startsWith(t)))) return 50;
  return 0;
}
function searchAll(raw){
  const q=norm(raw); if(!q) return [];
  const out=[];
  for(const it of Object.values(ITEMS)){const m=match(it,q);if(m) out.push({kind:"item",score:m.score+1,name:it.name,it,m});}
  for(const r of RECIPES){if(ITEMS[r.name]) continue; const s=nameMatch(r.name,q); if(s) out.push({kind:"recipe",score:s,name:r.name,r});}
  for(const u of UPGRADES){const s=nameMatch(u.name,q); if(s) out.push({kind:"upgrade",score:s,name:u.name,u});}
  for(const w of MANUALS){const s=Math.max(nameMatch(w.n,q),w.m?nameMatch("Manual "+w.n,q):0); if(s) out.push({kind:"manual",score:s,name:w.n,w});}
  out.sort((a,b)=>(b.score-a.score)||a.name.localeCompare(b.name));
  return out;
}

/* ---------- progress code ---------- */
// FOB1- then one digit per upgrade, in UPGRADES order
const makeCode=()=>{let b=0n;RECIPES.forEach((r,i)=>{if(learned.has(r.name))b|=1n<<BigInt(i);});let mb=0n;MANUALS.forEach((w,i)=>{if(manuals.has(w.n))mb|=1n<<BigInt(i);});return "FOB1-"+UPGRADES.map(u=>nDone(u)).join("")+(b||mb?"-"+b.toString(36).toUpperCase():"")+(mb?"-"+mb.toString(36).toUpperCase():"");};
function refreshCode(){if(document.activeElement!==$("#code")) $("#code").value=makeCode();}
const codeMsg=t=>{$("#codeMsg").textContent=t;};
$("#copyBtn").addEventListener("click",async()=>{
  const c=makeCode();$("#code").value=c;$("#code").select();
  try{await navigator.clipboard.writeText(c);codeMsg("Copied");}catch(e){codeMsg("Selected");}
});
$("#loadBtn").addEventListener("click",()=>{
  const m=$("#code").value.trim().toUpperCase().match(/^FOB1-(\d+)(?:-([0-9A-Z]+))?(?:-([0-9A-Z]+))?(?:\.(\d+))?$/);
  if(!m||m[1].length!==UPGRADES.length){codeMsg("Not a valid code");return;}
  UPGRADES.forEach((u,i)=>{done[u.id]=Math.min(+m[1][i],u.tiers.length);});
  let bits=0n;for(const ch of (m[2]||"").toLowerCase()) bits=bits*36n+BigInt(parseInt(ch,36));
  learned=new Set(RECIPES.filter((r,i)=>(bits>>BigInt(i))&1n).map(r=>r.name));saveL();
  let mbits=0n;for(const ch of (m[3]||"").toLowerCase()) mbits=mbits*36n+BigInt(parseInt(ch,36));
  manuals=new Set(MANUALS.filter((w,i)=>(mbits>>BigInt(i))&1n).map(w=>w.n));saveM();
  if(m[4]){tickLevel(+m[4]);saveL();}
  save();renderFob();renderStash();renderCraft();$("#code").blur();refreshCode();codeMsg("Loaded");
});
document.addEventListener("click",e=>{if(e.target.closest(".node")) refreshCode();});
refreshCode();

window.addEventListener("popstate",()=>{if(navStack.length) goBack();});
renderStash();renderFob();renderCraft();
tab(["fob","craft","loot"].includes(location.hash.slice(1))?location.hash.slice(1):"loot");
</script>
</body>
</html>
